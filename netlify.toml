[build]
  command = "npm run build:netlify"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "styles.css", "auth.css", "auth.js", "account-api.js", "app.js", "finance-query.js", "receipt-parser.js", "receipt-ui.js", "icon.svg", "google-g.png", "manifest.webmanifest", "sw.js"]

# Routing uses the Function's path:'/*' and preferStatic:true. Private HTML
# never goes in public, and private routes never fall back to a static SPA.
# Set environment values in the Netlify UI; no secrets in this file.
